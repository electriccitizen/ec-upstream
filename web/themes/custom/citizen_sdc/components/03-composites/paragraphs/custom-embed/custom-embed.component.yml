component:
  id: citizen_sdc:custom-embed
  label: 'Paragraph Custom Embed'
  description: 'Renders arbitrary HTML/JS pasted by an editor into `field_embed_content`. Optional widget title above the embed. The Drupal template passes the raw field value as the `embed` prop; the SDC prints it inside an `autoescape false` block so the markup renders unescaped.'
  status: experimental

props:
  type: object
  properties:
    attr:
      type: object
      description: 'Drupal Attributes object from the paragraph template (class-stripped).'
    title:
      type: [string, 'null']
      description: 'Optional widget title (field_widget_title), rendered as `<h2 class="paragraph--custom-embed__title">` above the embed.'
    embed:
      type: [string, 'null']
      description: 'Raw `field_embed_content` value — arbitrary HTML / JS / embed markup. Printed via an `autoescape false` block in the SDC so it renders unescaped.'

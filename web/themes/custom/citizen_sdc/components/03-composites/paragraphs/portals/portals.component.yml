component:
  id: citizen_sdc:portals
  label: 'Paragraph Portals'
  description: 'Grid of portal cards — each is an image + H3 headline inside a single link, with optional long-text description below. Fed by the `field_portals` custom_field (subfields `headline`, `link`, `image`, `additional_text`), flattened into a structured `items` array by the paragraph template, which reads the formatter output — see portals.md. The prop contract is source-agnostic: any code that can build `items` can use this SDC.'
  status: experimental

props:
  type: object
  required:
    - items
  properties:
    attr:
      type: Drupal\Core\Template\Attribute
      description: 'Drupal Attributes object from the paragraph template (class-stripped).'
    title:
      type: [string, 'null']
      description: 'Optional widget title from field_widget_title — rendered as `<h2 class="paragraph--portals__title">` above the grid.'
    items:
      type: array
      description: 'Array of portal card data. Each item: `{ id: string|int, link: { url, target?, rel? }, image: render-array (media rendered with `400x300` view mode), headline: string (required), long_text: render-array|null }`. `target`/`rel` come from the link subfield''s stored options and are empty unless link attributes are enabled on the field — external links get theirs from extlink at runtime.'
      items:
        type: object
        required:
          - id
          - link
          - image
          - headline
        properties:
          id:
            type: [string, integer]
          link:
            type: object
          image:
            type: [object, string]
          headline:
            type: string
          long_text:
            type: [object, string, 'null']

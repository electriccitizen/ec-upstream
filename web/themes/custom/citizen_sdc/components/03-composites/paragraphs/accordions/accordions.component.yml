component:
  id: citizen_sdc:accordions
  label: 'Paragraph Accordions'
  description: 'Expandable/collapsible accordion list. The Drupal template for `paragraph--accordions` flattens the `field_accordions` custom_field (subfields `header` + `text`) into a structured `items` array and passes it to this SDC, which renders the full accordion structure. The prop contract is source-agnostic — any template that can build `items` can use this SDC.'
  status: experimental

props:
  type: object
  required:
    - items
  properties:
    attr:
      type: Drupal\Core\Template\Attribute
      description: 'Drupal Attributes object from the paragraph template (class-stripped).'
    title:
      type: [string, 'null']
      description: 'Optional widget title from field_widget_title — rendered as `<h2 class="paragraph--accordions__title">` above the item list.'
    items:
      type: array
      description: 'Array of accordion item objects. Each item: `{ id: string (unique, used to coordinate aria-controls/id), header: string, body: render-array (processed_text) }`.'
      items:
        type: object
        required:
          - id
          - header
        properties:
          id:
            type: string
          header:
            type: string
          body:
            type: [object, string, 'null']
